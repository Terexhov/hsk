<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Китайский язык — HSK</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .hub { max-width: 700px; margin: 40px auto; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        .hub-card { background: white; border-radius: 16px; padding: 30px 20px; text-decoration: none; color: #333;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1); transition: transform 0.15s, box-shadow 0.15s; display: block; }
        .hub-card:hover { transform: translateY(-4px); box-shadow: 0 6px 20px rgba(0,0,0,0.16); }
        .hub-card .icon { font-size: 48px; display: block; margin-bottom: 12px; }
        .hub-card h2 { margin: 0 0 8px; font-size: 18px; }
        .hub-card p  { margin: 0; font-size: 13px; color: #888; line-height: 1.5; }
        @media(max-width:600px){ .hub { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <h1>Китайский язык</h1>
    <div class="hub">
        <a href="hsk2.html" class="hub-card">
            <span class="icon">📖</span>
            <h2>Словарь HSK 2</h2>
            <p>Карточки, тесты на перевод, иероглифы и аудирование. Умный алгоритм повторения.</p>
        </a>
        <a href="radicals.html" class="hub-card">
            <span class="icon">部</span>
            <h2>214 Радикалов</h2>
            <p>Все ключи Канси с русскими значениями и пиньинь. Основа для чтения иероглифов.</p>
        </a>
        <a href="speaking.html" class="hub-card">
            <span class="icon">🎤</span>
            <h2>Говорение</h2>
            <p>Упражнения на проставление тонов и практика произношения с микрофоном.</p>
        </a>
    </div>
</body>
</html>
